; Hazer-RX - ESP32-C3 + RS485 receiver, DMX512 out to the hazer
; The sketch lives in Hazer-RX/ so it still opens unchanged in the Arduino IDE.

[platformio]
src_dir = Hazer-RX

[env:esp32c3]
; Arduino-ESP32 core 3.x (the code uses the 3.x ESP-NOW callback signature)
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial over the C3's native USB port (same as "USB CDC On Boot: Enabled")
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
